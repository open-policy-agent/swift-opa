name: Check

on:
  workflow_dispatch: {}
  pull_request: {}

# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build Swift ${{ matrix.swift }}${{ matrix.xcode && format(', Xcode {0}', matrix.xcode) || '' }} (${{ matrix.container || matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "16.4"
            swift: "6.1" # We can't go more modern than 6.1.0 for the 6.1 runner, due to Xcode version support.
          - os: macos-26
            xcode: "26.2"
            swift: "6.2.3"
          - os: macos-26
            xcode: "26.4"
            swift: "6.3"
          - os: ubuntu-latest
            swift: "6.1"
            container: "swift:6.1"
          - os: ubuntu-latest
            swift: "6.2"
            container: "swift:6.2"
          - os: ubuntu-latest
            swift: "6.3"
            container: "swift:6.3"
    env:
      XCODE_VERSION: ${{ matrix.xcode }}
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app"
      SWIFT_VERSION: ${{ matrix.swift }}
    steps:
      - name: Select Xcode version
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch "${DEVELOPER_DIR}/Contents/Developer"
          xcodebuild -version
      - name: Show Swift version
        run: swift --version
      - name: Fail if Swift version does not match expected version (${{ matrix.swift }})
        run: |
          SWIFT_OUTPUT=$(swift --version)
          echo "${SWIFT_OUTPUT}"
          # Check if our expected Swift version is the one in use.
          if ! echo "${SWIFT_OUTPUT}" | grep -q "${SWIFT_VERSION}"; then
            ACTUAL=$(echo "${SWIFT_OUTPUT}" | head -n 1 | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n 1)
            echo "::error::Expected Swift ${SWIFT_VERSION}, got ${ACTUAL}"
            echo "**Version Mismatch**: Expected \`${SWIFT_VERSION}\`, got \`${ACTUAL}\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup zstd for GH cache (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y make zstd
      - name: Lint
        run: make lint
      - name: Restore .build
        id: "restore-build"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: "swiftpm-tests-build-${{ runner.os }}-${{ matrix.swift }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "swiftpm-tests-build-${{ runner.os }}-${{ matrix.swift }}-"
      - name: Build
        run: make build-ci
      - name: Cache .build
        if: steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: "swiftpm-tests-build-${{ runner.os }}-${{ matrix.swift }}-${{ github.event.pull_request.base.sha || github.event.after }}"
      - name: Test
        run: make test-ci
      - name: make fmt lint test (ComplianceSuite)
        run: make fmt lint test
        working-directory: ComplianceSuite
      - run: make test-compliance || true # NB: This doesn't succeed yet!

  build-minimal:
    name: Build minimal (all traits disabled)
    runs-on: ubuntu-latest
    container: "swift:6.2"
    permissions:
      contents: read
    steps:
      - name: Show Swift version
        run: swift --version
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y libjemalloc-dev make zstd
      - name: Restore .build
        id: "restore-build"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: "swiftpm-minimal-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "swiftpm-minimal-build-${{ runner.os }}-"
      - name: Build (minimal, all traits disabled)
        run: make build-minimal
      - name: Cache .build
        if: steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: "swiftpm-minimal-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"

  diff:
    name: diff compliance tests (vs main)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - run: swift --version
      - name: checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: pr/swift-opa
          fetch-depth: 0 # fetch all history for all branches and tags
          persist-credentials: false
      - name: checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: open-policy-agent/swift-opa
          ref: main
          path: main/swift-opa
          persist-credentials: false
      - name: Setup zstd for GH cache
        run: brew install zstd
      - name: Restore ComplianceSuite .build (main)
        id: "restore-compliance-main"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: main/swift-opa/ComplianceSuite/.build
          key: "compliance-build-main-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "compliance-build-main-${{ runner.os }}-"
      - name: Restore ComplianceSuite .build (pr)
        id: "restore-compliance-pr"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pr/swift-opa/ComplianceSuite/.build
          key: "compliance-build-pr-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "compliance-build-pr-${{ runner.os }}-"
      # The reason we fetch the passed/failed filter scripts from the PR
      # checkout folder, is so that we can change how those scripts work
      # in a PR, and immediately see the results in this job step.
      - name: compliance tests (main)
        run: |
          (make test-compliance || true) > results
          ../../../pr/swift-opa/ComplianceSuite/tools/passed.sh < results > ../../../main-passed
          ../../../pr/swift-opa/ComplianceSuite/tools/failed.sh < results > ../../../main-failed
        working-directory: main/swift-opa/ComplianceSuite
      - name: Cache ComplianceSuite .build (main)
        if: steps.restore-compliance-main.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: main/swift-opa/ComplianceSuite/.build
          key: "compliance-build-main-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
      - name: compliance tests (pr)
        run: |
          (make test-compliance || true) > results
          ./tools/passed.sh < results > ../../../pr-passed
          ./tools/failed.sh < results > ../../../pr-failed
        working-directory: pr/swift-opa/ComplianceSuite
      - name: Cache ComplianceSuite .build (pr)
        if: steps.restore-compliance-pr.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pr/swift-opa/ComplianceSuite/.build
          key: "compliance-build-pr-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
      - name: summary diff
        run: |
          diff_and_print() {
            local file1="$1"
            local file2="$2"
            local header="$3"

            if ! diff -q "$file1" "$file2" > /dev/null 2>&1; then
              echo "## $header"
              echo '```diff'
              diff "$file1" "$file2" || true
              echo '```'
            fi
          }
          diff_and_print main-passed pr-passed 'passed (main vs PR)' >> $GITHUB_STEP_SUMMARY
          diff_and_print main-failed pr-failed 'failed (main vs PR)' >> $GITHUB_STEP_SUMMARY

          new_failures="$(comm -23 pr-failed main-failed)"
          if [ -n "$new_failures" ]; then
            echo "::error::PR introduces new compliance failures not present on main:"
            echo "$new_failures" | while IFS= read -r line; do echo "  ❌ $line"; done
            exit 1
          fi

  capabilities-check:
    name: check generated files unchanged
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup zstd for GH cache
        run: brew install zstd
      - name: Restore .build
        id: "restore-build"
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            tools/SyncGen/.build
          key: "swiftpm-generate-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
          restore-keys: "swiftpm-generate-build-${{ runner.os }}-"
      - name: generate
        run: make generate
      - name: Cache .build
        if: steps.restore-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            tools/SyncGen/.build
          key: "swiftpm-generate-build-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.after }}"
      - name: check capabilities.json
        run: |
          if git diff --exit-code capabilities.json; then
            echo "capabilities.json is up-to-date"
          else
            echo "::error::capabilities.json needs to be updated — run: make generate"
            git diff capabilities.json
            exit 1
          fi
      - name: check SyncPeers.swift
        run: |
          if git diff --exit-code Sources/Rego/Generated/SyncPeers.swift; then
            echo "SyncPeers.swift is up-to-date"
          else
            echo "::error::SyncPeers.swift needs to be updated — run: make generate"
            git diff Sources/Rego/Generated/SyncPeers.swift
            exit 1
          fi

  gh-actions-lint:
    name: Github Actions Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
